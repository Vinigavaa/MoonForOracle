name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Prepare version, changelog, tag and GitHub Release
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-installer:
    name: Build and attach Windows installer
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate generated version
        shell: pwsh
        run: |
          $package = Get-Content apps/desktop/package.json | ConvertFrom-Json
          $expectedVersion = "${{ needs.release-please.outputs.version }}"
          $expectedTag = "v$expectedVersion"
          $actualTag = "${{ needs.release-please.outputs.tag_name }}"
          if ($package.version -ne $expectedVersion) {
            throw "Desktop package version '$($package.version)' must match release version '$expectedVersion'."
          }
          if ($actualTag -ne $expectedTag) {
            throw "Release tag '$actualTag' must match expected tag '$expectedTag'."
          }

      - name: Build workspace packages
        run: pnpm run build

      - name: Build desktop installer
        working-directory: apps/desktop
        run: |
          pnpm run build
          pnpm run build:renderer
          pnpm exec electron-builder --win --publish never

      - name: Validate release files
        shell: pwsh
        run: |
          $version = "${{ needs.release-please.outputs.version }}"
          $installer = "apps/desktop/release/MoonForOracle-$version-win-x64.exe"
          $requiredFiles = @($installer, "$installer.blockmap", "apps/desktop/release/latest.yml")
          foreach ($file in $requiredFiles) {
            if (-not (Test-Path -LiteralPath $file)) {
              throw "Expected release file was not generated: $file"
            }
          }
          $metadata = Get-Content "apps/desktop/release/latest.yml" -Raw
          if ($metadata -notmatch "(?m)^version:\s*$([regex]::Escape($version))\s*$") {
            throw "latest.yml does not contain expected version '$version'."
          }

      - name: Upload files to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ needs.release-please.outputs.version }}"
          $tag = "${{ needs.release-please.outputs.tag_name }}"
          $installer = "apps/desktop/release/MoonForOracle-$version-win-x64.exe"
          gh release upload $tag $installer "$installer.blockmap" "apps/desktop/release/latest.yml" --clobber
